<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Switch mécanique stylisé sur un circuit">
  <rect width="1600" height="1000" fill="#0F1419"/>
  <defs>
    <pattern id="ide-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2733" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#ide-grid)"/>

  <!-- corner brackets -->
  <g stroke="#4F8FFF" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 60 100 L 60 60 L 100 60"/>
    <path d="M 1500 60 L 1540 60 L 1540 100"/>
    <path d="M 60 900 L 60 940 L 100 940"/>
    <path d="M 1500 940 L 1540 940 L 1540 900"/>
  </g>

  <!-- Circuit traces (outer) -->
  <g stroke="#2A3440" stroke-width="2" fill="none">
    <path d="M 200 250 L 460 250 L 460 380 L 600 380"/>
    <path d="M 200 750 L 460 750 L 460 620 L 600 620"/>
    <path d="M 1400 250 L 1140 250 L 1140 380 L 1000 380"/>
    <path d="M 1400 750 L 1140 750 L 1140 620 L 1000 620"/>
  </g>
  <!-- Circuit dots -->
  <g fill="#4F8FFF">
    <circle cx="200" cy="250" r="6"/>
    <circle cx="200" cy="750" r="6"/>
    <circle cx="1400" cy="250" r="6"/>
    <circle cx="1400" cy="750" r="6"/>
    <circle cx="460" cy="380" r="4"/>
    <circle cx="460" cy="620" r="4"/>
    <circle cx="1140" cy="380" r="4"/>
    <circle cx="1140" cy="620" r="4"/>
  </g>

  <!-- Big mechanical switch (centered) -->
  <g transform="translate(640, 380)">
    <!-- outer body -->
    <rect width="320" height="240" fill="#161C24" stroke="#2A3440" stroke-width="2" rx="8"/>
    <!-- inner channel -->
    <rect x="40" y="80" width="240" height="80" fill="#0F1419" stroke="#1F2733" stroke-width="1" rx="4"/>
    <!-- toggle keycap (right = ON) -->
    <rect x="160" y="92" width="108" height="56" fill="#4F8FFF" rx="4"/>
    <!-- keycap detail line -->
    <line x1="172" y1="120" x2="252" y2="120" stroke="#0F1419" stroke-width="2" opacity="0.6"/>
    <!-- screws at corners -->
    <g stroke="#2A3440" stroke-width="1.5" fill="none">
      <circle cx="20" cy="20" r="6"/>
      <circle cx="300" cy="20" r="6"/>
      <circle cx="20" cy="220" r="6"/>
      <circle cx="300" cy="220" r="6"/>
    </g>
    <!-- labels -->
    <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#8A929C" letter-spacing="0.08em">
      <text x="60" y="56">[ off ]</text>
      <text x="260" y="56" text-anchor="end" fill="#4F8FFF">[ on ]</text>
    </g>
  </g>

  <!-- mono captions -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8A929C">
    <text x="60" y="40" letter-spacing="0.04em">// editor.switch</text>
    <text x="60" y="980" letter-spacing="0.04em">[ veille / 01 ]</text>
    <text x="1540" y="980" text-anchor="end" letter-spacing="0.04em">cursor &gt;&gt; vs code</text>
  </g>
</svg>
