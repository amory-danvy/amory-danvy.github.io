<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cadenas à combinaison wireframe">
  <rect width="1600" height="1000" fill="#0F1419"/>
  <defs>
    <pattern id="sec-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2733" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#sec-grid)"/>

  <!-- corner brackets -->
  <g stroke="#4F8FFF" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 60 100 L 60 60 L 100 60"/>
    <path d="M 1500 60 L 1540 60 L 1540 100"/>
    <path d="M 60 900 L 60 940 L 100 940"/>
    <path d="M 1500 940 L 1540 940 L 1540 900"/>
  </g>

  <!-- Padlock body -->
  <g transform="translate(640, 200)" stroke="#4F8FFF" stroke-width="2.5" fill="none">
    <!-- shackle -->
    <path d="M 70 140 L 70 80 A 90 90 0 0 1 250 80 L 250 140" stroke-linecap="round"/>
    <!-- body -->
    <rect x="20" y="140" width="280" height="240" rx="14" fill="#161C24"/>
    <!-- keyhole / dial circle -->
    <circle cx="160" cy="220" r="22" fill="none" stroke="#4F8FFF" stroke-width="2"/>
    <circle cx="160" cy="220" r="4" fill="#4F8FFF"/>
  </g>

  <!-- Combination wheels (right side) -->
  <g transform="translate(1000, 380)" font-family="JetBrains Mono, ui-monospace, monospace" font-size="40" font-weight="500" fill="#4F8FFF" letter-spacing="0.05em">
    <!-- 4 wheels -->
    <g>
      <rect x="0" y="0" width="80" height="120" fill="#161C24" stroke="#2A3440" stroke-width="1" rx="6"/>
      <text x="40" y="46" text-anchor="middle" fill="#2A3440" font-size="22">8</text>
      <text x="40" y="76" text-anchor="middle">2</text>
      <text x="40" y="106" text-anchor="middle" fill="#2A3440" font-size="22">5</text>
    </g>
    <g transform="translate(96, 0)">
      <rect x="0" y="0" width="80" height="120" fill="#161C24" stroke="#2A3440" stroke-width="1" rx="6"/>
      <text x="40" y="46" text-anchor="middle" fill="#2A3440" font-size="22">3</text>
      <text x="40" y="76" text-anchor="middle">9</text>
      <text x="40" y="106" text-anchor="middle" fill="#2A3440" font-size="22">1</text>
    </g>
    <g transform="translate(192, 0)">
      <rect x="0" y="0" width="80" height="120" fill="#161C24" stroke="#2A3440" stroke-width="1" rx="6"/>
      <text x="40" y="46" text-anchor="middle" fill="#2A3440" font-size="22">7</text>
      <text x="40" y="76" text-anchor="middle">4</text>
      <text x="40" y="106" text-anchor="middle" fill="#2A3440" font-size="22">0</text>
    </g>
    <g transform="translate(288, 0)">
      <rect x="0" y="0" width="80" height="120" fill="#161C24" stroke="#2A3440" stroke-width="1" rx="6"/>
      <text x="40" y="46" text-anchor="middle" fill="#2A3440" font-size="22">2</text>
      <text x="40" y="76" text-anchor="middle">0</text>
      <text x="40" y="106" text-anchor="middle" fill="#2A3440" font-size="22">9</text>
    </g>
  </g>

  <!-- mono captions -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8A929C">
    <text x="60" y="40" letter-spacing="0.04em">// secret.exposure</text>
    <text x="60" y="980" letter-spacing="0.04em">[ veille / 02 ]</text>
    <text x="1540" y="980" text-anchor="end" letter-spacing="0.04em">risk · 40%</text>
  </g>
</svg>
