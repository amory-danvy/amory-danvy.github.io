<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Façade d'immeuble nuit avec une fenêtre éclairée">
  <rect width="1600" height="1000" fill="#0F1419"/>
  <defs>
    <pattern id="nh-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2733" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#nh-grid)"/>

  <!-- corner brackets -->
  <g stroke="#4F8FFF" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 60 100 L 60 60 L 100 60"/>
    <path d="M 1500 60 L 1540 60 L 1540 100"/>
    <path d="M 60 900 L 60 940 L 100 940"/>
    <path d="M 1500 940 L 1540 940 L 1540 900"/>
  </g>

  <!-- Building facade -->
  <g transform="translate(280, 140)">
    <!-- vertical structural lines -->
    <line x1="0" y1="0" x2="0" y2="720" stroke="#2A3440" stroke-width="2"/>
    <line x1="1040" y1="0" x2="1040" y2="720" stroke="#2A3440" stroke-width="2"/>
    <!-- horizontal floors -->
    <g stroke="#1F2733" stroke-width="1">
      <line x1="0" y1="120" x2="1040" y2="120"/>
      <line x1="0" y1="240" x2="1040" y2="240"/>
      <line x1="0" y1="360" x2="1040" y2="360"/>
      <line x1="0" y1="480" x2="1040" y2="480"/>
      <line x1="0" y1="600" x2="1040" y2="600"/>
    </g>

    <!-- window grid (8 cols × 6 rows = 48 windows; some lit) -->
    <g>
      <!-- row 1 -->
      <rect x="40" y="40" width="80" height="60" fill="#1F2733"/>
      <rect x="170" y="40" width="80" height="60" fill="#2A3440"/>
      <rect x="300" y="40" width="80" height="60" fill="#1F2733"/>
      <rect x="430" y="40" width="80" height="60" fill="#1F2733"/>
      <rect x="560" y="40" width="80" height="60" fill="#2A3440"/>
      <rect x="690" y="40" width="80" height="60" fill="#1F2733"/>
      <rect x="820" y="40" width="80" height="60" fill="#1F2733"/>
      <rect x="950" y="40" width="80" height="60" fill="#1F2733"/>
      <!-- row 2 -->
      <rect x="40" y="160" width="80" height="60" fill="#1F2733"/>
      <rect x="170" y="160" width="80" height="60" fill="#1F2733"/>
      <rect x="300" y="160" width="80" height="60" fill="#1F2733"/>
      <rect x="430" y="160" width="80" height="60" fill="#2A3440"/>
      <rect x="560" y="160" width="80" height="60" fill="#1F2733"/>
      <rect x="690" y="160" width="80" height="60" fill="#1F2733"/>
      <rect x="820" y="160" width="80" height="60" fill="#1F2733"/>
      <rect x="950" y="160" width="80" height="60" fill="#1F2733"/>
      <!-- row 3 — featured lit window -->
      <rect x="40" y="280" width="80" height="60" fill="#1F2733"/>
      <rect x="170" y="280" width="80" height="60" fill="#1F2733"/>
      <rect x="300" y="280" width="80" height="60" fill="#1F2733"/>
      <rect x="430" y="280" width="80" height="60" fill="#1F2733"/>
      <rect x="560" y="280" width="80" height="60" fill="#4F8FFF" opacity="0.95"/>
      <rect x="690" y="280" width="80" height="60" fill="#1F2733"/>
      <rect x="820" y="280" width="80" height="60" fill="#1F2733"/>
      <rect x="950" y="280" width="80" height="60" fill="#1F2733"/>
      <!-- row 4 -->
      <rect x="40" y="400" width="80" height="60" fill="#1F2733"/>
      <rect x="170" y="400" width="80" height="60" fill="#2A3440"/>
      <rect x="300" y="400" width="80" height="60" fill="#1F2733"/>
      <rect x="430" y="400" width="80" height="60" fill="#1F2733"/>
      <rect x="560" y="400" width="80" height="60" fill="#1F2733"/>
      <rect x="690" y="400" width="80" height="60" fill="#1F2733"/>
      <rect x="820" y="400" width="80" height="60" fill="#2A3440"/>
      <rect x="950" y="400" width="80" height="60" fill="#1F2733"/>
      <!-- row 5 -->
      <rect x="40" y="520" width="80" height="60" fill="#1F2733"/>
      <rect x="170" y="520" width="80" height="60" fill="#1F2733"/>
      <rect x="300" y="520" width="80" height="60" fill="#2A3440"/>
      <rect x="430" y="520" width="80" height="60" fill="#1F2733"/>
      <rect x="560" y="520" width="80" height="60" fill="#1F2733"/>
      <rect x="690" y="520" width="80" height="60" fill="#1F2733"/>
      <rect x="820" y="520" width="80" height="60" fill="#1F2733"/>
      <rect x="950" y="520" width="80" height="60" fill="#1F2733"/>
      <!-- row 6 -->
      <rect x="40" y="640" width="80" height="60" fill="#1F2733"/>
      <rect x="170" y="640" width="80" height="60" fill="#1F2733"/>
      <rect x="300" y="640" width="80" height="60" fill="#1F2733"/>
      <rect x="430" y="640" width="80" height="60" fill="#2A3440"/>
      <rect x="560" y="640" width="80" height="60" fill="#1F2733"/>
      <rect x="690" y="640" width="80" height="60" fill="#1F2733"/>
      <rect x="820" y="640" width="80" height="60" fill="#1F2733"/>
      <rect x="950" y="640" width="80" height="60" fill="#1F2733"/>
    </g>

    <!-- highlight ring on the lit window -->
    <rect x="600" y="280" width="0" height="0"/>
    <g transform="translate(560, 280)" stroke="#4F8FFF" stroke-width="1.5" fill="none" opacity="0.7">
      <line x1="-12" y1="-12" x2="-12" y2="-2"/>
      <line x1="-12" y1="-12" x2="-2" y2="-12"/>
      <line x1="92" y1="-12" x2="92" y2="-2"/>
      <line x1="92" y1="-12" x2="82" y2="-12"/>
      <line x1="-12" y1="72" x2="-12" y2="62"/>
      <line x1="-12" y1="72" x2="-2" y2="72"/>
      <line x1="92" y1="72" x2="92" y2="62"/>
      <line x1="92" y1="72" x2="82" y2="72"/>
    </g>
  </g>

  <!-- mono captions -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8A929C">
    <text x="60" y="40" letter-spacing="0.04em">// signal.detected</text>
    <text x="60" y="980" letter-spacing="0.04em">[ project / 02 ]</text>
    <text x="1540" y="980" text-anchor="end" letter-spacing="0.04em">scan · 1 / 48 lit</text>
  </g>
</svg>
