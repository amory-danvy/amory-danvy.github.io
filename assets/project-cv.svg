<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Plan d'architecte stylisé d'un CV">
  <rect width="1600" height="1000" fill="#0F1419"/>
  <defs>
    <pattern id="cv-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2733" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#cv-grid)"/>

  <!-- corner brackets -->
  <g stroke="#4F8FFF" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 60 100 L 60 60 L 100 60"/>
    <path d="M 1500 60 L 1540 60 L 1540 100"/>
    <path d="M 60 900 L 60 940 L 100 940"/>
    <path d="M 1500 940 L 1540 940 L 1540 900"/>
  </g>

  <!-- A4 document blueprint, centered -->
  <g transform="translate(540, 180)">
    <rect width="520" height="660" fill="none" stroke="#4F8FFF" stroke-width="2" stroke-dasharray="10 6"/>
    <!-- header band -->
    <rect x="40" y="40" width="200" height="42" fill="#4F8FFF" opacity="0.55"/>
    <rect x="40" y="100" width="320" height="6" fill="#2A3440"/>
    <rect x="40" y="118" width="220" height="6" fill="#2A3440"/>
    <!-- divider -->
    <line x1="40" y1="160" x2="480" y2="160" stroke="#1F2733" stroke-width="1"/>
    <!-- section 1 -->
    <rect x="40" y="190" width="64" height="6" fill="#4F8FFF"/>
    <rect x="40" y="212" width="360" height="4" fill="#1F2733"/>
    <rect x="40" y="228" width="320" height="4" fill="#1F2733"/>
    <rect x="40" y="244" width="380" height="4" fill="#1F2733"/>
    <!-- section 2 -->
    <rect x="40" y="290" width="64" height="6" fill="#4F8FFF"/>
    <rect x="40" y="312" width="380" height="4" fill="#1F2733"/>
    <rect x="40" y="328" width="320" height="4" fill="#1F2733"/>
    <rect x="40" y="344" width="240" height="4" fill="#1F2733"/>
    <!-- section 3 -->
    <rect x="40" y="390" width="64" height="6" fill="#4F8FFF"/>
    <rect x="40" y="412" width="360" height="4" fill="#1F2733"/>
    <rect x="40" y="428" width="280" height="4" fill="#1F2733"/>
    <rect x="40" y="444" width="320" height="4" fill="#1F2733"/>
    <rect x="40" y="460" width="240" height="4" fill="#1F2733"/>
    <!-- bottom corner mark -->
    <rect x="380" y="560" width="100" height="60" fill="none" stroke="#4F8FFF" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- mono captions -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8A929C">
    <text x="60" y="40" letter-spacing="0.04em">// cv.layout</text>
    <text x="60" y="980" letter-spacing="0.04em">[ project / 01 ]</text>
    <text x="1540" y="980" text-anchor="end" letter-spacing="0.04em">a4 · 210×297mm</text>
  </g>
</svg>
